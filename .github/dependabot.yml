version: 2
updates:
  # One entry per ecosystem and directory: GitHub rejects the whole file otherwise, and Dependabot keeps using the last valid copy.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 2
    groups:
      npm-critical:
        patterns:
          - "wrangler"
          - "vite"
          - "@builder.io/qwik"
          - "@builder.io/qwik-city"
      npm:
        patterns:
          - "*"
  # Qwik's ESLint rules, isolated because their TypeScript parser supports TypeScript below 6.1 only.
  - package-ecosystem: "npm"
    directory: "/tools/lint"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      lint:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:00"
      timezone: "Africa/Johannesburg"
    groups:
      github-actions:
        patterns:
          - "*"
